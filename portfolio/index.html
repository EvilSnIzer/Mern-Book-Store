    <script>
      // Set reduced-motion + coarse-pointer flags as early as possible so the
      // very first paint already respects the user's preferences (no flash).
      try {
        var mq = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var coarse = window.matchMedia('(pointer: coarse)').matches
        document.documentElement.classList.toggle('reduce-motion', mq)
        document.documentElement.classList.toggle('is-touch', coarse)
      } catch (e) {}
    </script>
