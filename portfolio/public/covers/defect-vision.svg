<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0e2a52" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <g stroke="#4f7cff" stroke-opacity="0.14" stroke-width="1">
    <circle cx="860" cy="220" r="260" fill="none"/>
    <circle cx="860" cy="220" r="360" fill="none"/>
    <circle cx="860" cy="220" r="460" fill="none"/>
  </g>

  <text x="70" y="610" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="120" font-weight="600" fill="#f2f2f0" letter-spacing="-2">Defect Vision</text>
  <text x="74" y="668" font-family="monospace" font-size="22" letter-spacing="6" fill="#4f7cff">COMPUTER VISION · 2024</text>
  <text x="74" y="736" font-family="monospace" font-size="15" letter-spacing="2" fill="#5a5a5a">PLACEHOLDER COVER — replace with a real screenshot</text>

  <rect width="1200" height="800" filter="url(#grain)" opacity="1"/>
</svg>